[package]
name = "lux-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "alx"
path = "src/main.rs"

[features]
default = []
native-all = ["native-wy", "native-kw", "native-kg", "native-tx", "native-mg"]
native-wy = ["lux-native", "lux-native/wy"]
native-kw = ["lux-native", "lux-native/kw"]
native-kg = ["lux-native", "lux-native/kg"]
native-tx = ["lux-native", "lux-native/tx"]
native-mg = ["lux-native", "lux-native/mg"]

[dependencies]
lux-core = { path = "../lux-core" }
lux-native = { path = "../lux-native", optional = true }

clap = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
colored = { workspace = true }
tabled = { workspace = true }
anyhow = { workspace = true }
rquickjs = { workspace = true }
ring = { workspace = true }
rsa = { workspace = true }
flate2 = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
md-5 = { workspace = true }
hex = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
id3 = { workspace = true }
metaflac = { workspace = true }

