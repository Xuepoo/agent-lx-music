[workspace]
members = [
    "crates/lux-core",
    "crates/lux-native",
    "crates/lux-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.8"
edition = "2024"
authors = ["rust-lx authors"]
license = "MIT"
description = "A terminal-native music CLI replacing lx-music-desktop, powered by Agentic intelligence."
repository = "https://github.com/Xuepoo/agent-lx-music"
homepage = "https://github.com/Xuepoo/agent-lx-music"
readme = "README.md"

[workspace.dependencies]
# Core
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"
toml = "0.8.19"
dirs = "6.0.0"
async-trait = "0.1.86"

# Network & Async
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "sync"] }
reqwest = { version = "0.12.12", features = ["rustls-tls", "json"], default-features = false }

# CLI parsing
clap = { version = "4.5.28", features = ["derive", "env"] }

# Utilities
colored = "3.0.0"
tabled = "0.17.0"
indicatif = "0.17.11"
anyhow = "1.0.95"
rquickjs = { version = "0.9.0", features = ["bindgen"] }
ring = "0.17.11"
rsa = "0.9.7"
flate2 = "1.0.35"
aes = "0.8.4"
cbc = "0.1.2"
md-5 = "0.10.6"
hex = "0.4.3"
rusqlite = { version = "0.32.0", features = ["bundled"] }
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
rand = "0.8.5"
id3 = "1.16.2"
metaflac = "0.2.7"

