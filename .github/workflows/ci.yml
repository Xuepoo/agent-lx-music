name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Continuous Integration (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libmpv-dev mpv

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Quality Gate
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --all-features

  release:
    name: Cross-Compilation Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux amd64 (gnu)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: alx
            release_filename: alx-linux-x86_64
          # Linux arm64 (gnu)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: alx
            release_filename: alx-linux-aarch64
          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: alx
            release_filename: alx-macos-x86_64
          # macOS Apple Silicon (arm64)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: alx
            release_filename: alx-macos-aarch64
          # Windows amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: alx.exe
            release_filename: alx-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Cross Compile Toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64 libmpv-dev:arm64
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build Release Target
        run: cargo build --release --target ${{ matrix.target }} --bin alx

      - name: Package Binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.release_filename }}
          else
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.release_filename }}
            tar -czf dist/${{ matrix.release_filename }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.artifact_name }}
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_filename }}
          path: dist/*

  package-linux:
    name: Package Debian, RPM, and APK (${{ matrix.arch }})
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            artifact_name: alx-linux-x86_64
          - arch: arm64
            artifact_name: alx-linux-aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-linux

      - name: Install nFPM
        uses: goreleaser/nfpm-action@v2
        with:
          install-only: true

      - name: Build Packages (nFPM)
        run: |
          # Prepare binary for nFPM
          cp dist-linux/${{ matrix.artifact_name }} ./alx
          chmod +x ./alx
          
          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/v}
          export VERSION
          export ARCH=${{ matrix.arch }}
          
          # Compile deb, rpm, apk
          nfpm package --config nfpm.yaml --target dist-linux/agent-lx-music_${VERSION}_${ARCH}.deb --packager deb
          nfpm package --config nfpm.yaml --target dist-linux/agent-lx-music_${VERSION}_${ARCH}.rpm --packager rpm
          nfpm package --config nfpm.yaml --target dist-linux/agent-lx-music_${VERSION}_${ARCH}.apk --packager apk

      - name: Upload Linux Packages Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            dist-linux/*.deb
            dist-linux/*.rpm
            dist-linux/*.apk

  publish:
    name: Create GitHub Release & Upload Assets
    needs: [release, package-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: Gather Assets
        run: |
          mkdir -p release-assets
          find all-dist -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.apk" -o -name "*.tar.gz" -o -name "*.exe" \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
