name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux AMD64 (gnu)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: alx-linux-x86_64
            binary_name: alx
          # Linux ARM64 (gnu) - Using native arm64 runner!
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: alx-linux-aarch64
            binary_name: alx
          # Windows AMD64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: alx-windows-x86_64.exe
            binary_name: alx.exe
          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: alx-macos-x86_64
            binary_name: alx
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: alx-macos-aarch64
            binary_name: alx

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libmpv-dev

      - name: Setup Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Target
        run: cargo build --release --target ${{ matrix.target }} --bin alx

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.artifact_name }}

      - name: Package Binary (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.artifact_name }}
          tar -czf dist/${{ matrix.artifact_name }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}

      - name: Build Debian, RPM, and APK packages (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            NFPM_ARCH="arm64"
          else
            NFPM_ARCH="amd64"
          fi
          
          # Prepare binary for nFPM
          cp target/${{ matrix.target }}/release/alx ./alx
          chmod +x ./alx
          
          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/v}
          export VERSION
          export ARCH=${NFPM_ARCH}
          
          # Download and install nFPM
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.37.1/nfpm_2.37.1_Linux_${NFPM_ARCH}.tar.gz | tar xz nfpm
          
          # Compile packages
          ./nfpm package --config nfpm.yaml --target dist/agent-lx-music_${VERSION}_${NFPM_ARCH}.deb --packager deb
          ./nfpm package --config nfpm.yaml --target dist/agent-lx-music_${VERSION}_${NFPM_ARCH}.rpm --packager rpm
          ./nfpm package --config nfpm.yaml --target dist/agent-lx-music_${VERSION}_${NFPM_ARCH}.apk --packager apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: Gather Release Assets
        run: |
          mkdir -p release-assets
          find all-dist -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.apk" -o -name "*.tar.gz" -o -name "*.exe" \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
