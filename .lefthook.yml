# Lefthook Git hooks manager configuration.
# Install hooks after cloning: `lefthook install`
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    lint:
      glob: "*.rs"
      run: cargo clippy --workspace --all-features -- -D warnings
    markdown:
      glob: "*.md"
      run: markdownlint-cli2 {staged_files}
pre-push:
  commands:
    check:
      run: cargo check
    test:
      run: cargo test --workspace --all-features
